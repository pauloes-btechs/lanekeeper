for (const x of [-0.08, 0.08]) add(new THREE.BoxGeometry(0.05, 0.02, 0.01), new THREE.MeshStandardMaterial({ color: 0xc9a14a, metalness: 1, roughness: 0.25 }), x, 0.2, 0.656);
// headlight wash on the lane ahead
{ const hl = new THREE.SpotLight(0xeef5ff, 3.2, 7, 0.55, 0.85, 1.6); hl.position.set(0, 0.28, -0.7); hl.target.position.set(0, 0, -4); robot.add(hl, hl.target); }

// ---------- glass: ahead of the robot only; swept lane behind it ----------
{
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x9fd8b0, roughness: 0.03, metalness: 0, transmission: 0.6, thickness: 0.01, ior: 1.5, clearcoat: 1, specularIntensity: 1.6, envMapIntensity: 2.5 });
  const brownMat = glassMat.clone(); brownMat.color.set(0xc9a46a); brownMat.transmission = 0.8;
  const clearMat = glassMat.clone(); clearMat.color.set(0xe8f2f2);
  const geo = new THREE.TetrahedronGeometry(1, 0);
  const clusters = [[0.12, 0.35, 90, 0.32, glassMat], [-0.28, 1.1, 50, 0.22, brownMat], [0.3, 1.75, 35, 0.2, clearMat], [-0.05, -0.35, 30, 0.2, glassMat]];
  for (const [cx, cz, n, rad, mat] of clusters) {
    const inst = new THREE.InstancedMesh(geo, mat, n); inst.castShadow = true; const o = new THREE.Object3D();
    for (let i = 0; i < n; i++) { const a = rnd() * 6.283, d = Math.pow(rnd(), 0.6) * rad;
      const s = 0.006 + Math.pow(rnd(), 2) * 0.028;
      o.position.set(Math.max(-0.75, Math.min(0.75, cx + Math.cos(a) * d)), s * 0.25, cz + Math.sin(a) * d * 1.6);
      o.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6); o.scale.set(s, s * 0.25, s * (0.6 + rnd())); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); }
    scene.add(inst);
  }
  // a bottle neck and base from the broken bottle
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.07, 24, 1, true), brownMat); neck.rotation.set(Math.PI / 2, 0, 0.9); neck.position.set(-0.24, 0.014, 1.2); neck.castShadow = true; scene.add(neck);
}
// faint wet trail behind the robot where it vacuumed
{ const t = canvasTex(256, 1024, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(w * .1, 0, w * .8, h); }, [1, 1], false);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 6), new THREE.MeshStandardMaterial({ color: 0x2f6a49, roughness: 0.35, transparent: true, opacity: 0.35, alphaMap: t, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(-0.03, 0.0035, -4.6); scene.add(m); }

// ---------- camera + post ----------
const camera = new THREE.PerspectiveCamera(17, W / H, 0.05, 900);
camera.position.set(1.55, 0.52, 4.6); camera.lookAt(-0.08, 0.24, -1.05);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
const focus = camera.position.distanceTo(new THREE.Vector3(-0.03, 0.3, -0.7));
composer.addPass(new BokehPass(scene, camera, { focus, aperture: 0.0055, maxblur: 0.014 }));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.35, 0.6, 0.92));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 3.7 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      vec2 d = vUv - 0.5; float v = smoothstep(0.85, 0.25, length(d * vec2(1.0, 0.85)));
      c.rgb *= mix(0.72, 1.0, v);
      c.rgb += (h(vUv * 1000.0) - 0.5) * 0.028;
      c.rgb = mix(c.rgb, c.rgb * vec3(1.02, 0.99, 0.96), 0.6);
      gl_FragColor = c; }`
}));

composer.render();
requestAnimationFrame(() => { composer.render(); window.__done = true; });
</script>
