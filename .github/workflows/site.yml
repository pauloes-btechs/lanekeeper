name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Lint, test and build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Cost model in JS matches the Python script
        run: python3 ../analysis/cost_model.py
      - run: npm run build
      - name: Built site has the 3D model, city data and legacy pages
        run: |
          test -s dist/models/lk-01.glb
          test -s dist/data/cities.json
          test -s dist/presentation/index.html
          test -s dist/run-report/index.html
          node -e "const m=require('./dist/data/cities.json'); if(!m.cities.length) process.exit(1); for (const c of m.cities) require('fs').statSync('dist/data/'+c.slug+'.geojson'); console.log(m.cities.map(c=>c.name+': '+c.laneMiles+' mi').join('\n'))"

  request-demo:
    name: Demo request function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/request-demo/index_test.ts
